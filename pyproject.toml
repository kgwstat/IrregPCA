[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "irregpca"
version = "0.2.0"
description = "Neural-network functional PCA for irregularly observed data"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [
    { name = "Kartik G. Waghmare", email = "kartik.waghmare.stats@gmail.com" }
]
keywords = ["functional data analysis", "PCA", "irregular observations", "neural network"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.0",
    "numpy>=1.22",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.4",
    "mypy>=1.0",
    "build>=1.0",
    "matplotlib>=3.5",
]
viz = [
    "matplotlib>=3.5",
]

[project.urls]
Homepage   = "https://github.com/kgwstat/IrregPCA"
Repository = "https://github.com/kgwstat/IrregPCA"
"Bug Tracker" = "https://github.com/kgwstat/IrregPCA/issues"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["irregpca*"]

[tool.mypy]
python_version = "3.9"
strict = false
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.coverage.run]
source = ["irregpca"]
omit = ["tests/*"]
